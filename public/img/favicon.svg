<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Thresh Favicon — Overlapping squares with grain stalk -->
  <!-- Ember gold (#C9A227) on transparent -->

  <!-- Square 1: axis-aligned -->
  <rect x="5" y="5" width="22" height="22" fill="none" stroke="#C9A227" stroke-width="1.5"/>

  <!-- Square 2: rotated 30° (off-kilter, avoids Star of David symmetry) -->
  <rect x="5" y="5" width="22" height="22" fill="none" stroke="#C9A227" stroke-width="1.5" transform="rotate(30 16 16)"/>

  <!-- Central grain stalk — simplified for small size -->
  <line x1="16" y1="9" x2="16" y2="23" stroke="#C9A227" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="12" x2="13.5" y2="10" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="12" x2="18.5" y2="10" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="15.5" x2="13.5" y2="13.5" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="15.5" x2="18.5" y2="13.5" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="19" x2="14" y2="17" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="19" x2="18" y2="17" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>
</svg>
