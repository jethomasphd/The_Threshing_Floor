<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- The Thresh Sigil — Overlapping squares with grain stalk at center -->
  <!-- Ember gold (#C9A227) on transparent -->

  <!-- Square 1: axis-aligned -->
  <rect x="8" y="8" width="32" height="32" fill="none" stroke="#C9A227" stroke-width="1.5"/>

  <!-- Square 2: rotated 30° (off-kilter, avoids Star of David symmetry) -->
  <rect x="8" y="8" width="32" height="32" fill="none" stroke="#C9A227" stroke-width="1.5" transform="rotate(30 24 24)"/>

  <!-- Central grain stalk — vertical stem with angled seed pairs -->
  <line x1="24" y1="14" x2="24" y2="35" stroke="#C9A227" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Grain seeds — paired leaves ascending the stalk -->
  <line x1="24" y1="18" x2="20" y2="15.5" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>
  <line x1="24" y1="18" x2="28" y2="15.5" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>

  <line x1="24" y1="22" x2="20.5" y2="19.5" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>
  <line x1="24" y1="22" x2="27.5" y2="19.5" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>

  <line x1="24" y1="26" x2="21" y2="23.5" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>
  <line x1="24" y1="26" x2="27" y2="23.5" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>

  <line x1="24" y1="30" x2="21.5" y2="27.5" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>
  <line x1="24" y1="30" x2="26.5" y2="27.5" stroke="#C9A227" stroke-width="1" stroke-linecap="round"/>
</svg>
